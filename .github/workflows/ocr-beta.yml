name: Clean obsolete 4.1.2 beta attachments
on:
  push:
    branches: [codex/cleanup-4.1.2-release-assets]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Remove obsolete APK and diagnostics and correct installation notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          tag = "v4.1.2-beta.1"
          repo = os.environ["GITHUB_REPOSITORY"]
          state = json.loads(subprocess.check_output(
              ["gh", "release", "view", tag, "--repo", repo, "--json", "assets,body"], text=True))
          names = {a["name"] for a in state["assets"]}
          obsolete = {"apk-verification.json", "ocrOnly.log", "s5cOnly.log", "SHA256SUMS",
                      "BADNOTE-4.1.2-beta.1-SideBySide-Debug.apk"}
          for name in sorted(names & obsolete):
              subprocess.run(["gh", "release", "delete-asset", tag, name, "--repo", repo, "--yes"], check=True)
          signed = {"bad-note-Android-4.1.2-beta.1-Update.apk", "bad-note-Android-4.1.2-beta.1-SideBySide.apk"}
          if not signed.issubset(names):
              install = (
                  "## 설치\n\n기존 배포 서명키 연결을 기다리고 있습니다. 업데이트용과 병행 설치용 APK의 "
                  "컴파일 및 검사는 완료했으며, 기존 배포 서명과 일치하는 키로 서명한 뒤 공개합니다.\n\n"
                  "공개할 파일은 `bad-note-Android-4.1.2-beta.1-Update.apk`, "
                  "`bad-note-Android-4.1.2-beta.1-SideBySide.apk`와 GitHub의 Source code ZIP/TAR.GZ입니다. "
                  "기존 임시 Debug APK와 진단 첨부는 제거했습니다.\n\n")
              body = re.sub(r"## 설치\s.*?(?=## 검증)", lambda _: install, state["body"], flags=re.S)
              body = body.replace("검사 기록과 APK SHA-256도 함께 첨부합니다.",
                  "검사 기록과 APK SHA-256은 GitHub Actions 빌드 기록에서 확인할 수 있습니다.")
              path = Path(os.environ["RUNNER_TEMP"]) / "badnote-beta-notes.md"
              path.write_text(body, encoding="utf-8")
              subprocess.run(["gh", "release", "edit", tag, "--repo", repo, "--prerelease",
                              "--latest=false", "--notes-file", str(path)], check=True)
          print("Obsolete 4.1.2 beta attachments removed.")
          PY
