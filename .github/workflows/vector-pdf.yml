name: Native vector PDF regressions

on:
  push:
    branches: [codex/vector-pdf-export]
  pull_request:
    branches: [main, codex/ocr-4.1.2-beta.1]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vector-pdf-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python3 -m pip install Pillow==12.3.0 pypdf==6.10.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Bounded PDF assembly, binary preservation and independent parsing
        run: python3 tools/test_pdf_assembler.py
      - name: Existing OCR and native validation tool regressions
        run: |
          python3 tools/test_ocr_evaluation.py
          python3 tools/test_ocr_tools.py
          python3 tools/test_apk_native.py
          python3 tools/test_pdfium_prepare.py
          python3 tools/test_release_upgrade.py
          python3 tools/test_native_validation.py
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools'
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Full JVM suite in 96 MiB heaps and isolated Android APKs
        working-directory: android
        run: |
          bash ./gradlew --no-daemon --console=plain --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g -PbadnoteVectorPdfTests=true \
            :app:testSideBySideDebugUnitTest :app:assembleSideBySideDebug :app:assembleSideBySideDebugAndroidTest
      - name: Upload test APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vector-pdf-test-apks
          path: |
            android/app/build/outputs/apk/sideBySide/debug/*.apk
            android/app/build/outputs/apk/androidTest/sideBySide/debug/*.apk
          if-no-files-found: error

  android:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [23, 35]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Download this run's test APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name vector-pdf-test-apks --dir build/vector-pdf-apks
      - name: Allow emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native PdfDocument and PdfRenderer integration
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          disable-animations: true
          script: bash tools/check_vector_pdf_device.sh
      - name: Save instrumentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vector-pdf-api-${{ matrix.api }}
          path: build/vector-pdf-*.log
          if-no-files-found: warn
