name: Vector PDF minimum-API diagnostics
on:
  push:
    branches: [codex/vector-pdf-diagnostics]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Download the exact APKs that failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38576258650 --repo "$GITHUB_REPOSITORY" --name vector-pdf-test-apks --dir build/vector-pdf-apks
      - name: Prepare Android diagnostic capture
        run: |
          cat > build/diagnose-vector-pdf.sh <<'SH'
          set +e
          adb logcat -c
          bash tools/check_vector_pdf_device.sh
          result=$?
          adb logcat -d -b crash -v threadtime > build/vector-pdf-crash.log
          adb logcat -d -v threadtime > build/vector-pdf-logcat.log
          cat build/vector-pdf-crash.log
          tail -250 build/vector-pdf-logcat.log
          exit "$result"
          SH
      - name: Allow emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reproduce with Android crash logs
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 23
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash build/diagnose-vector-pdf.sh
      - name: Preserve crash evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vector-pdf-api23-diagnostics
          path: build/vector-pdf-*.log
