name: Native Android regressions

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, codex/release-4.2.1]

permissions:
  contents: read

concurrency:
  group: native-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python3 -m pip install Pillow==12.3.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools'
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Tool regressions
        run: |
          python3 tools/test_ocr_evaluation.py
          python3 tools/test_ocr_tools.py
          python3 tools/test_apk_native.py
          python3 tools/test_pdfium_prepare.py
          python3 tools/test_release_upgrade.py
          python3 tools/test_native_validation.py
      - name: Native tests and isolated APKs
        working-directory: android
        run: |
          bash ./gradlew --no-daemon --console=plain --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g \
            :app:testSideBySideDebugUnitTest :app:lintSideBySideDebug :app:assembleSideBySideDebug :app:assembleSideBySideDebugAndroidTest
      - name: Verify APK using its generated version metadata
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          folder = pathlib.Path('android/app/build/outputs/apk/sideBySide/debug')
          metadata = json.loads((folder / 'output-metadata.json').read_text())
          element = metadata['elements'][0]
          subprocess.run([
              sys.executable, 'tools/verify_apk.py', str(folder / element['outputFile']),
              '--build-tools', os.environ['ANDROID_HOME'] + '/build-tools/36.1.0',
              '--expected-package', 'com.inkforge.note5.debug',
              '--expected-min-sdk', '23', '--expected-target-sdk', '36',
              '--expected-version-code', str(element['versionCode']),
              '--expected-version-name', element['versionName'],
              '--pdfium-manifest', 'build/dependencies/pdfium-8086/verification.json',
          ], check=True)
          PY
      - name: Allow emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: OCR, writing, viewport, export and asset cleanup checks
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/check_ocr_beta_device.sh
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-validation
          path: |
            build/ocr-beta/*.log
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-*.xml
          if-no-files-found: warn
