import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def signingProperties = new Properties()
def signingFile = rootProject.file('local-signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }

android {
    namespace 'com.inkforge.notesstudio'
    compileSdk 36
    buildToolsVersion '36.1.0'

    defaultConfig {
        minSdk 23
        targetSdk 36
        versionCode 401
        versionName '4.0.1'
        testInstrumentationRunner 'com.inkforge.notesstudio.NativeSmokeInstrumentation'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    flavorDimensions += 'install'
    productFlavors {
        update {
            dimension 'install'
            applicationId 'com.inkforge.note4'
            resValue 'string', 'app_variant', '업데이트용'
        }
        sideBySide {
            dimension 'install'
            applicationId 'com.inkforge.note5'
            resValue 'string', 'app_variant', '병행 설치용'
        }
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing false
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
    testOptions {
        unitTests.all { maxHeapSize = '96m' }
    }

    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
    }

    lint {
        checkReleaseBuilds true
        abortOnError true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'com.google.mlkit:digital-ink-recognition:19.0.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
}

// The old WebView editor is no longer shipped. Only the bounded migration page is needed.
android.sourceSets.main.assets.srcDirs = ['src/nativeAssets']
