import java.util.Properties
import com.android.build.api.artifact.SingleArtifact

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

def signingProperties = new Properties()
def signingFile = rootProject.file('local-signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }
def ocrBetaEnabled = providers.gradleProperty('badnoteOcrBeta').orElse('false').get().toBoolean()

android {
    namespace 'com.inkforge.notesstudio'
    compileSdk 36
    buildToolsVersion '36.1.0'
    ndkVersion '28.2.13676358'

    defaultConfig {
        minSdk 23
        targetSdk 36
        versionCode 421
        versionName '4.1.4-beta.1'
        testInstrumentationRunner 'com.inkforge.notesstudio.NativeSmokeInstrumentation'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments "-DPDFIUM_ROOT=${rootProject.file('../build/dependencies/pdfium-8086').absolutePath.replace('\\', '/')}"
            }
        }
    }

    flavorDimensions += 'install'
    productFlavors {
        update {
            dimension 'install'
            applicationId 'com.inkforge.note4'
            resValue 'string', 'app_variant', '업데이트용'
        }
        sideBySide {
            dimension 'install'
            applicationId 'com.inkforge.note5'
            resValue 'string', 'app_variant', '병행 설치용'
        }
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing false
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            buildConfigField 'boolean', 'OCR_LAYOUT_V2', 'true'
            buildConfigField 'boolean', 'OCR_MIXED_SOURCES', 'true'
        }
        release {
            buildConfigField 'boolean', 'OCR_LAYOUT_V2', ocrBetaEnabled.toString()
            buildConfigField 'boolean', 'OCR_MIXED_SOURCES', ocrBetaEnabled.toString()
            minifyEnabled false
            shrinkResources false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
        profile {
            // Measure production execution without touching the user's installed package.
            initWith release
            applicationIdSuffix '.debug'
            versionNameSuffix '-profile'
            signingConfig signingConfigs.debug
            debuggable false
            matchingFallbacks = ['release']
        }
    }
    testBuildType providers.gradleProperty('badnoteTestBuildType').orElse('debug').get()

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
            buildStagingDirectory rootProject.file('../build/native-cmake-staging')
        }
    }
    buildFeatures { buildConfig true; compose true }
    testOptions {
        unitTests.all { maxHeapSize = '96m' }
    }

    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
    }

    lint {
        checkReleaseBuilds true
        abortOnError true
    }
}

dependencies {
    implementation project(':ocr-contracts')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.room:room-runtime:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.graphics:graphics-core:1.0.4'
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'com.google.mlkit:digital-ink-recognition:19.0.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
}

// The old WebView editor is no longer shipped. Only the bounded migration page is needed.
android.sourceSets.main.assets.srcDirs = ['src/nativeAssets', layout.buildDirectory.dir('generated/pdfium-assets').get().asFile]

def preparedPdfium = rootProject.file('../build/dependencies/pdfium-8086')
def preparePdfium = tasks.register('preparePdfium') {
    doLast {
        def python = System.getenv('BADNOTE_PYTHON') ?: (System.getProperty('os.name').startsWith('Windows') ? 'python' : 'python3')
        project.exec { commandLine python, rootProject.file('../tools/prepare_pdfium.py').absolutePath }
        copy {
            from new File(preparedPdfium, 'pdfium-notices.txt')
            into layout.buildDirectory.dir('generated/pdfium-assets').get().asFile
        }
    }
}
tasks.configureEach {
    if (name.startsWith('configureCMake') || name == 'preBuild' || (name.startsWith('merge') && name.endsWith('Assets')))
        dependsOn preparePdfium
}
afterEvaluate {
    tasks.matching { it.name.startsWith('l8DexDesugarLib') && it.name.endsWith('ProfileAndroidTest') }.configureEach {
        // Instrumentation loads its library before the target app's library. AGP 8.13.2
        // otherwise keeps only APIs used by tests, hiding APIs still needed by the app.
        // Retain the test copy; production Profile/Release dex is unchanged.
        keepRulesConfigurations.add('-keep class j$.** { *; }')
    }
}

// Collect successful assemble results in the repository's public APK directory.
// Keeping this on the assemble tasks covers direct Gradle builds and Python helpers.
def collectApk = { component, version, label, destination ->
    def apkDirectory = component.artifacts.get(SingleArtifact.APK.INSTANCE)
    def artifactsLoader = component.artifacts.getBuiltArtifactsLoader()
    def assembleName = 'assemble' + component.name.capitalize()
    tasks.matching { it.name == assembleName }.configureEach {
        doLast {
            def artifacts = artifactsLoader.load(apkDirectory.get())
            if (artifacts == null || artifacts.elements.isEmpty()) {
                throw new GradleException('No APK output metadata for ' + component.name)
            }
            artifacts.elements.each { artifact ->
                def source = file(artifact.outputFile)
                if (!source.isFile()) throw new GradleException('Missing APK: ' + source)
                def filters = artifact.filters.collect { it.identifier }.join('-')
                def suffix = label + (filters ? '-' + filters : '') +
                    (source.name.endsWith('-unsigned.apk') ? '-Unsigned' : '')
                def filename = 'bad-note-Android-' + version.get() + '-' + suffix + '.apk'
                copy {
                    from source
                    into destination
                    rename { filename }
                }
                logger.lifecycle('APK: ' + new File(destination, filename))
            }
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def install = variant.productFlavors.find { it.first == 'install' }.second
        def isDebug = variant.buildType == 'debug'
        def isProfile = variant.buildType == 'profile'
        def label = install == 'update' ? (isDebug ? 'Debug' : isProfile ? 'Profile' : 'Update') :
            (isDebug ? 'SideBySide-Debug' : isProfile ? 'SideBySide-Profile' : 'SideBySide')
        def version = variant.outputs.first().versionName.map {
            isDebug ? it.replaceFirst(/-debug$/, '') : isProfile ? it.replaceFirst(/-profile$/, '') : it
        }
        collectApk(variant, version, label, rootProject.file('../build/apk'))
        if (variant.androidTest != null) {
            collectApk(variant.androidTest, version, label + '-AndroidTest',
                rootProject.file('../build/apk/tests'))
        }
    }
}
